<script>

  reveals.forEach(function(el){

function fmt(n){return n>=1000?n.toLocaleString('en-US'):String(n);}
function setVal(el,v){el.textContent=(el.getAttribute('data-countup-prefix')||'')+fmt(v)+(el.getAttribute('data-countup-suffix')||'');}
var counts=document.querySelectorAll('[data-countup]');

  var to=parseInt(el.getAttribute('data-countup-to'),10)||0;
